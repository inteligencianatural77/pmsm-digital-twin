[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmsm-hybrid-control"
version = "0.1.0"
description = "Migracion Python del modelo PMSM 1FT7087 (M4)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

# scipy se agregara solo cuando una fase futura lo requiera.

[tool.setuptools.packages.find]
include = ["pmsm_hybrid_control*"]

[tool.pytest.ini_options]
testpaths = ["pmsm_hybrid_control/tests"]
pythonpath = ["."]
